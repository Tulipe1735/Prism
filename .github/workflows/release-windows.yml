name: Release Windows desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
      - name: Check version
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          if (!/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG) || `v${version}` !== process.env.RELEASE_TAG)
            throw new Error('The requested tag does not match the application version');
          if (!readFileSync('src/shared/version.ts', 'utf8').includes(`"${version}"`))
            throw new Error('Kernel and application versions differ');
          JS
      - name: Install Windows packaging tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine wine64 wine32:i386
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Install browser used by integration tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify source
        run: |
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
      - name: Build installer
        run: pnpm package:win
      - name: Verify built workbench and plugin slots
        run:
          pnpm exec vitest run tests/workbench/browser.smoke.test.ts
          tests/workbench/plugin-ui.browser.test.ts
        env:
          PRISM_WORKBENCH_BROWSER: "1"
      - name: Verify update metadata and create checksums
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { parse } from 'yaml';
          const version = process.env.RELEASE_TAG.slice(1);
          const filename = `Prism-${version}-Setup-x64.exe`;
          const bytes = readFileSync(`release/${filename}`);
          const metadata = parse(readFileSync('release/latest.yml', 'utf8'));
          const sha512 = createHash('sha512').update(bytes).digest('base64');
          if (metadata.version !== version || metadata.path !== filename || metadata.sha512 !== sha512 || metadata.files[0]?.sha512 !== sha512 || metadata.files[0]?.url !== filename || metadata.files[0]?.size !== bytes.length)
            throw new Error('Update metadata does not match the installer');
          JS
          cd release
          sha256sum "Prism-${RELEASE_TAG#v}-Setup-x64.exe" "Prism-${RELEASE_TAG#v}-Setup-x64.exe.blockmap" latest.yml > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > /tmp/prism-release-draft; then
            if [ "$(cat /tmp/prism-release-draft)" = false ]; then
              echo "Release is already published; preserving existing assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "Prism $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "release/Prism-${RELEASE_TAG#v}-Setup-x64.exe" "release/Prism-${RELEASE_TAG#v}-Setup-x64.exe.blockmap" release/latest.yml release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
