<?xml version="1.0" encoding="UTF-8"?>
<svg
            id="architecture-root"
            viewBox="0 0 1280 720"
            xmlns="http://www.w3.org/2000/svg"
            role="img"
            aria-labelledby="prism-system-title prism-system-desc"
          >
            <title id="prism-system-title">Prism Agent · 整体架构</title>
            <desc id="prism-system-desc">
              Prism 的 Windows 工作台通过桌面服务连接 WSL
              内核，内核管理任务循环、模型、工具、会话和权限审批，并接入身份与更新服务。
            </desc>
            <defs>
      <style>#architecture-root { --paper: #ffffff;
        --surface: #f7f8fa;
        --ink: #1f2328;
        --muted: #6b7280;
        --rule: #e7e9ed;
        --accent: #2563eb;
        --font-sans:
          "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
        --font-mono:
          "SFMono-Regular", "Cascadia Code", "Consolas", ui-monospace, monospace; }
      #architecture-root { color: var(--ink); font-family: var(--font-sans); }
      #architecture-root .lead { max-width: 780px;
        margin: 0;
        font-size: 16px;
        color: var(--muted); }
      #architecture-root nav { display: flex;
        flex-wrap: wrap;
        gap: 12px 28px;
        margin-top: 24px; }
      #architecture-root a { color: var(--accent);
        text-underline-offset: 4px; }
      #architecture-root a:focus-visible, #architecture-root summary:focus-visible { outline: 2px solid var(--accent);
        outline-offset: 4px; }
      #architecture-root section { margin-top: 40px;
        scroll-margin-top: 20px; }
      #architecture-root .diagram-container { width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow-x: auto; }
      #architecture-root text { fill: var(--ink); }
      #architecture-root .diagram-title { font-family: var(--font-sans);
        font-size: 40px;
        font-weight: 600;
        letter-spacing: -1px; }
      #architecture-root .node-name { font-family: var(--font-sans);
        font-size: 16px;
        font-weight: 600; }
      #architecture-root .body { font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 400;
        fill: var(--muted); }
      #architecture-root .zone-label { font-family: var(--font-sans);
        font-size: 12px;
        font-weight: 500;
        fill: var(--muted); }
      #architecture-root .technical, #architecture-root .arrow-label { font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 400;
        fill: var(--muted); }
      #architecture-root .tag { font-family: var(--font-mono);
        font-size: 8px;
        font-weight: 500;
        fill: var(--muted);
        letter-spacing: 0.04em; }
      #architecture-root .caption { margin: 12px 40px 24px;
        max-width: 1000px;
        color: var(--muted); }
      #architecture-root .notes { display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 28px;
        margin: 32px 40px; }
      #architecture-root .note { padding-top: 16px;
        border-top: 1px solid var(--rule); }
      #architecture-root code { font-family: var(--font-mono);
        font-size: 12px;
        overflow-wrap: anywhere; }
      #architecture-root details { margin: 32px 40px;
        padding-top: 20px;
        border-top: 1px solid var(--rule); }
      #architecture-root summary { cursor: pointer;
        font-weight: 600; }
      #architecture-root .table-scroll { overflow-x: auto;
        margin-top: 16px; }
      #architecture-root table { width: 100%;
        border-collapse: collapse;
        font-size: 13px; }
      #architecture-root th, #architecture-root td { text-align: left;
        vertical-align: top;
        padding: 12px;
        border-bottom: 1px solid var(--rule); }
      #architecture-root th { background: var(--surface);
        font-weight: 600; }
      #architecture-root .notes { grid-template-columns: 1fr; }
      #architecture-root .notes, #architecture-root details, #architecture-root .caption { margin-left: 0;
          margin-right: 0; }
      #architecture-root nav { display: none; }
      #architecture-root .diagram-container { overflow-x: visible; }
      #architecture-root section { break-inside: avoid; }</style>
              <marker
                id="architecture-prism-system-arrow-muted"
                markerWidth="8"
                markerHeight="6"
                refX="7"
                refY="3"
                orient="auto"
              >
                <path d="M0 0 L8 3 L0 6 Z" fill="#6b7280" />
              </marker>
              <marker
                id="architecture-prism-system-arrow-accent"
                markerWidth="8"
                markerHeight="6"
                refX="7"
                refY="3"
                orient="auto"
              >
                <path d="M0 0 L8 3 L0 6 Z" fill="#2563eb" />
              </marker>
            </defs>
            <rect x="0" y="0" width="1280" height="720" fill="#ffffff" />
            <text x="40" y="57" class="diagram-title">Prism Agent · 整体架构</text>
            <text x="40" y="86" class="body">
              从用户任务到模型调用、工具执行、结果落盘与界面反馈。基于 v0.2.3 当前实现。
            </text>
