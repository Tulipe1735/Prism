<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Repeated Submit</title>
    <style>
      body {
        font: 18px sans-serif;
        margin: 40px;
      }
      .entry,
      td {
        padding: 12px;
      }
      button {
        padding: 12px;
      }
    </style>
    <script src="/support.js" defer></script>
  </head>
  <body data-success="Submit completed for Account settings">
    <h1>Manage entries</h1>
    <main id="controls">
      <section class="entry">
        <h2>Privacy settings</h2>
        <button type="button" data-target="0">Submit</button>
      </section>
      <section class="entry">
        <h2>Account settings</h2>
        <button type="button" data-target="1" data-correct>Submit</button>
      </section>
      <section class="entry">
        <h2>Notification settings</h2>
        <button type="button" data-target="2">Submit</button>
      </section>
    </main>
    <dialog id="notice"><button id="dismiss">Dismiss update notice</button></dialog>
    <p id="result" role="status">Pending</p>
    <div id="eval-state" hidden data-wrong-targets="0" data-mutations="0"></div>
  </body>
</html>
