<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article,
      section,
      fieldset,
      li,
      [role="group"] {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      h2,
      h3 {
        font-size: 16px;
        margin: 4px;
      }
      td {
        padding: 3px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/paper-confirmatory-v1/support.js" defer></script>
  </head>
  <body>
    <h1>Manage entries</h1>
    <main id="controls">
      <div role="group">
        <span>Atlas</span
        ><button type="button" data-target="0" data-description="Atlas" data-correct>
          Edit
        </button>
      </div>
      <div role="group">
        <span>Orion</span
        ><button type="button" data-target="1" data-description="Orion">Edit</button>
      </div>
      <div role="group">
        <span>Vega</span
        ><button type="button" data-target="2" data-description="Vega">Edit</button>
      </div>
      <section>
        <h2>Support East</h2>
        <article>
          <span>Assistance</span
          ><button
            type="button"
            data-target="3"
            data-description="Help in Support East"
          >
            Help
          </button>
        </article>
      </section>
      <section>
        <h2>Support West</h2>
        <article>
          <span>Assistance</span
          ><button
            type="button"
            data-target="4"
            data-description="Help in Support West"
          >
            Help
          </button>
        </article>
      </section>
    </main>
    <p id="result" role="status">Pending</p>
    <div
      id="eval-state"
      hidden
      data-wrong-targets="0"
      data-correct-actions="0"
      data-mutations="0"
    ></div>
  </body>
</html>
