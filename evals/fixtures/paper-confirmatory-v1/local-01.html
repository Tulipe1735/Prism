<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article,
      section,
      fieldset,
      li,
      [role="group"] {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      h2,
      h3 {
        font-size: 16px;
        margin: 4px;
      }
      td {
        padding: 3px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/paper-confirmatory-v1/support.js" defer></script>
  </head>
  <body>
    <h1>Manage entries</h1>
    <main id="controls">
      <table>
        <tbody>
          <tr>
            <td>Birch</td>
            <td>$29</td>
            <td>
              <button type="button" data-target="0" data-description="Birch">
                Delete
              </button>
            </td>
          </tr>
          <tr>
            <td>Cedar</td>
            <td>$29</td>
            <td>
              <button
                type="button"
                data-target="1"
                data-description="Cedar"
                data-correct
              >
                Delete
              </button>
            </td>
          </tr>
          <tr>
            <td>Maple</td>
            <td>$29</td>
            <td>
              <button type="button" data-target="2" data-description="Maple">
                Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
    <p id="result" role="status">Pending</p>
    <div
      id="eval-state"
      hidden
      data-wrong-targets="0"
      data-correct-actions="0"
      data-mutations="0"
    ></div>
  </body>
</html>
