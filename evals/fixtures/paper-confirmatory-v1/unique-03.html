<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article,
      section,
      fieldset,
      li,
      [role="group"] {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      h2,
      h3 {
        font-size: 16px;
        margin: 4px;
      }
      td {
        padding: 3px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/paper-confirmatory-v1/support.js" defer></script>
  </head>
  <body>
    <h1>Manage entries</h1>
    <main id="controls">
      <article>
        <h2>Refresh</h2>
        <button type="button" data-target="0" data-description="Refresh">
          Refresh
        </button>
      </article>
      <article>
        <h2>Preview</h2>
        <button type="button" data-target="1" data-description="Preview">
          Preview
        </button>
      </article>
      <article>
        <h2>Export report</h2>
        <button
          type="button"
          data-target="2"
          data-description="Export report"
          data-correct
        >
          Export report
        </button>
      </article>
    </main>
    <p id="result" role="status">Pending</p>
    <div
      id="eval-state"
      hidden
      data-wrong-targets="0"
      data-correct-actions="0"
      data-mutations="0"
    ></div>
  </body>
</html>
