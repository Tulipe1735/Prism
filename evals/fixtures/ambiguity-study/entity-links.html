<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article,
      section,
      fieldset,
      li,
      .row {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      td {
        padding: 3px;
      }
      h2,
      h3 {
        font-size: 16px;
        margin: 4px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/ambiguity-study/support.js" defer></script>
  </head>
  <body data-order="2,1,0" data-layout="normal">
    <h1>Manage entries</h1>
    <main id="controls">
      <li>
        <span>Orion</span><a href="#" data-target="0" data-description="Orion">Open</a>
      </li>
      <li>
        <span>Lyra</span><a href="#" data-target="1" data-description="Lyra">Open</a>
      </li>
      <li>
        <span>Vega</span
        ><a href="#" data-target="2" data-correct data-description="Vega">Open</a>
      </li>
    </main>
    <p id="result" role="status">Pending</p>
    <div id="eval-state" hidden data-wrong-targets="0" data-mutations="0"></div>
  </body>
</html>
