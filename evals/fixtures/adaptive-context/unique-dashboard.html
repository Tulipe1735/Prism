<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      h2 {
        font-size: 16px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/ambiguity-study/support.js" defer></script>
  </head>
  <body data-order="1,2,0" data-layout="normal">
    <h1>Manage entries</h1>
    <main id="controls">
      <article>
        <h2>Open settings</h2>
        <a href="#" data-target="0" data-description="Open settings">Open settings</a>
      </article>
      <article>
        <h2>Open dashboard</h2>
        <a href="#" data-target="1" data-correct data-description="Open dashboard"
          >Open dashboard</a
        >
      </article>
      <article>
        <h2>Open help</h2>
        <a href="#" data-target="2" data-description="Open help">Open help</a>
      </article>
    </main>
    <p id="result" role="status">Pending</p>
    <div id="eval-state" hidden data-wrong-targets="0" data-mutations="0"></div>
  </body>
</html>
