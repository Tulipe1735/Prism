<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Control selection</title>
    <style>
      body {
        font: 16px sans-serif;
        margin: 20px;
      }
      article {
        margin: 6px;
        padding: 4px;
      }
      button,
      a {
        display: inline-block;
        padding: 8px;
        margin: 4px;
      }
      h2 {
        font-size: 16px;
      }
      #controls {
        max-width: 900px;
      }
    </style>
    <script src="/ambiguity-study/support.js" defer></script>
  </head>
  <body data-order="2,0,1" data-layout="normal">
    <h1>Manage entries</h1>
    <main id="controls">
      <article>
        <h2>Cancel</h2>
        <button type="button" data-target="0" data-description="Cancel">Cancel</button>
      </article>
      <article>
        <h2>Save profile</h2>
        <button
          type="button"
          data-target="1"
          data-correct
          data-description="Save profile"
        >
          Save profile
        </button>
      </article>
      <article>
        <h2>Help</h2>
        <button type="button" data-target="2" data-description="Help">Help</button>
      </article>
    </main>
    <p id="result" role="status">Pending</p>
    <div id="eval-state" hidden data-wrong-targets="0" data-mutations="0"></div>
  </body>
</html>
