<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Prism eval: repeated-delete</title>
    <style>
      body {
        font: 18px sans-serif;
        margin: 40px;
      }
      button {
        padding: 16px;
        margin: 12px;
      }
      article,
      form {
        padding: 8px;
      }
      dialog {
        padding: 50px;
      }
      dialog::backdrop {
        background: #0008;
      }
    </style>
    <script src="/support.js" defer></script>
  </head>
  <body data-scenario="repeated-delete" data-success="Deleted Item B">
    <h1>Repeated Delete</h1>
    <p id="revision">Use the controls below.</p>
    <main id="controls">
      <article>
        Item A <button aria-label="Delete Item A" data-target="a">Delete</button>
      </article>
      <article>
        Item B
        <button aria-label="Delete Item B" data-target="b" data-correct>Delete</button>
      </article>
    </main>
    <dialog id="notice">
      <p>A new revision is available.</p>
      <button id="dismiss">Dismiss update notice</button>
    </dialog>
    <p id="result" role="status">Pending</p>
    <div id="eval-state" hidden data-wrong-targets="0" data-mutations="0"></div>
  </body>
</html>
